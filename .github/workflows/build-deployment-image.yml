name: Build deployment image

on:
  push:
    tags:
      - "deploy-*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mysql-compatibility:
    name: ${{ matrix.database_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - database_name: MySQL 5.5
            database_image: mysql:5.5
          - database_name: MySQL 5.6
            database_image: mysql:5.6
          - database_name: MySQL 5.7
            database_image: mysql:5.7
          - database_name: MySQL 8.0
            database_image: mysql:8.0
          - database_name: MySQL 8.4
            database_image: mysql:8.4
          - database_name: MySQL 9.4
            database_image: mysql:9.4
          - database_name: MariaDB 10.1
            database_image: mariadb:10.1
          - database_name: MariaDB 10.6
            database_image: mariadb:10.6
          - database_name: MariaDB 11.4
            database_image: mariadb:11.4
    services:
      mysql:
        image: ${{ matrix.database_image }}
        env:
          MYSQL_ROOT_PASSWORD: test-root-password
          MYSQL_DATABASE: starbot_test
          MYSQL_USER: starbot_test
          MYSQL_PASSWORD: test-database-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -ptest-root-password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      MYSQL_TEST_DATABASE: "true"
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: 3306
      MYSQL_USER: starbot_test
      MYSQL_PASSWORD: test-database-password
      MYSQL_DATABASE: starbot_test
      MYSQL_SSL: "false"
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run MySQL adapter tests
        run: npm test -- tests/mysql-adapter.test.ts

  build:
    needs: mysql-compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build Linux image
        run: docker build --platform linux/amd64 --tag "star-webbot:${GITHUB_SHA}" .

      - name: Export image
        run: |
          mkdir -p dist
          docker save "star-webbot:${GITHUB_SHA}" | gzip -1 > dist/star-webbot-linux-amd64.tar.gz
          cp dist/star-webbot-linux-amd64.tar.gz dist/star-webbot-linux-amd64.mirror.bundle
          sha256sum dist/star-webbot-linux-amd64.tar.gz > dist/star-webbot-linux-amd64.tar.gz.sha256

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: star-webbot-linux-amd64
          path: |
            dist/star-webbot-linux-amd64.tar.gz
            dist/star-webbot-linux-amd64.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/deploy-')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/star-webbot-linux-amd64.tar.gz \
            dist/star-webbot-linux-amd64.mirror.bundle \
            dist/star-webbot-linux-amd64.tar.gz.sha256 \
            --title "Star WebBot ${GITHUB_REF_NAME}" \
            --notes "Automated Linux amd64 deployment image for ${GITHUB_SHA}."
